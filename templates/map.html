{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.4.0/dist/maplibre-gl.css">

<div class="nexus-map-shell">
    <div id="nexus-map"></div>

    <div class="map-topbar">
        <div class="map-title-card">
            <div class="map-kicker">🌍 NEXUS GEO MEMORY</div>
            <h1>My Photos Across India</h1>
            <p><strong id="asset-count">{{ geo_images|length }}</strong> GPS memories • live 3D globe</p>
        </div>
        <div id="map-status" class="map-status">LOADING EARTH…</div>
    </div>

    <div class="map-controls">
        <button type="button" class="map-control-btn" onclick="jumpToLiveLocation()">📍 <span>MY LOCATION</span></button>
        <button type="button" class="map-control-btn" onclick="returnToIndia()">🇮🇳 <span>INDIA</span></button>
        <button type="button" class="map-control-btn" onclick="resetGlobe()">🌐 <span>GLOBE</span></button>
    </div>

    <div class="map-legend">
        <div><i class="legend-dot live"></i> Live location</div>
        <div><i class="legend-dot photo"></i> Photo location</div>
        <div><i class="cluster-dot">12</i> Cluster</div>
    </div>

    <aside id="photo-panel" class="photo-panel" aria-hidden="true">
        <button class="panel-close" onclick="closePhotoPanel()">×</button>
        <div id="panel-content"></div>
    </aside>

    <div id="jump-hud" class="jump-hud" aria-hidden="true">
        <div class="jump-spinner"></div>
        <div>
            <div class="jump-kicker">NEXUS JUMP</div>
            <div id="jump-label">LOCKING DESTINATION…</div>
        </div>
    </div>

    <div id="map-error" class="map-error hidden"></div>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.4.0/dist/maplibre-gl.mjs';

const PHOTO_DATA = {{ geo_images | tojson }};
const INDIA_CENTER = [78.9629, 20.5937]; // lng, lat
const OPENFREE_MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const TERRAIN_URL = 'https://tiles.mapterhorn.com/tilejson.json';

let map = null;
let liveCoords = null;
let currentFocus = [...INDIA_CENTER];
let liveMarker = null;
let liveAccuracy = null;
let jumpToken = 0;
let isJumping = false;

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function validCoord(value) {
    const n = Number(value);
    return Number.isFinite(n);
}

function setStatus(text) {
    const el = document.getElementById('map-status');
    if (el) el.textContent = text;
}

function showError(message) {
    const el = document.getElementById('map-error');
    if (!el) return;
    el.innerHTML = escapeHtml(message);
    el.classList.remove('hidden');
}

function hideError() {
    document.getElementById('map-error')?.classList.add('hidden');
}

function usablePhotos() {
    return PHOTO_DATA.filter(p => validCoord(p.latitude) && validCoord(p.longitude));
}

function photoCollection() {
    return {
        type: 'FeatureCollection',
        features: usablePhotos().map((img, index) => ({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: [Number(img.longitude), Number(img.latitude)]
            },
            properties: {
                id: String(img._id?.$oid || img._id || index),
                filename: img.filename || 'Photo',
                thumb_url: img.thumb_url || img.url || '',
                url: img.url || '',
                folder_name: img.folder_name || 'General',
                latitude: Number(img.latitude),
                longitude: Number(img.longitude)
            }
        }))
    };
}

function showJumpHud(label) {
    const hud = document.getElementById('jump-hud');
    const text = document.getElementById('jump-label');
    if (text) text.textContent = label || 'PHOTO LOCATION';
    hud?.classList.add('active');
    hud?.setAttribute('aria-hidden', 'false');
}

function hideJumpHud() {
    const hud = document.getElementById('jump-hud');
    hud?.classList.remove('active');
    hud?.setAttribute('aria-hidden', 'true');
}

function photoGroupAt(lng, lat) {
    // GPS coordinates usually match exactly after our 6-decimal DB storage.
    // A tiny tolerance also groups photos from the same camera location.
    const tolerance = 0.00008;
    return usablePhotos().filter(p =>
        Math.abs(Number(p.longitude) - lng) <= tolerance &&
        Math.abs(Number(p.latitude) - lat) <= tolerance
    );
}

function openPhotoPanel(images, lat, lng, label) {
    const panel = document.getElementById('photo-panel');
    const content = document.getElementById('panel-content');
    if (!panel || !content) return;

    const cards = images.slice(0, 15).map(img => `
        <a class="panel-photo" href="${escapeHtml(img.url || '#')}" target="_blank" rel="noopener">
            <img src="${escapeHtml(img.thumb_url || img.url || '')}" alt="${escapeHtml(img.filename || 'Photo')}">
            <div>
                <strong>${escapeHtml(img.filename || 'Photo')}</strong>
                <small>ROOM: ${escapeHtml(img.folder_name || 'General')}</small>
            </div>
        </a>
    `).join('');

    content.innerHTML = `
        <div class="panel-kicker">${images.length} MEMORY${images.length === 1 ? '' : 'IES'}</div>
        <h2>${escapeHtml(label || 'Pinned location')}</h2>
        <div class="coords">${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}</div>
        <div class="panel-actions">
            <button onclick="openExternalMaps(${Number(lat)}, ${Number(lng)})">🧭 GO THERE</button>
            <button onclick="closePhotoPanel()">HIDE</button>
        </div>
        <div class="panel-divider"></div>
        <div class="panel-photo-list">${cards}</div>
        ${images.length > 15 ? '<p class="panel-more">Showing first 15 photos at this location.</p>' : ''}
    `;

    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
}

function closePhotoPanel() {
    const panel = document.getElementById('photo-panel');
    panel?.classList.remove('open');
    panel?.setAttribute('aria-hidden', 'true');
}

function openExternalMaps(lat, lng) {
    const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
    window.open(url, '_blank', 'noopener');
}

function createLiveMarker(lng, lat) {
    if (liveMarker) liveMarker.remove();

    const el = document.createElement('div');
    el.className = 'live-marker';
    el.innerHTML = '<span class="live-pulse"></span><span class="live-core"></span>';

    liveMarker = new maplibregl.Marker({element: el, anchor: 'center'})
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup({offset: 18}).setHTML('<strong style="font:800 11px sans-serif">📍 You are here</strong>'))
        .addTo(map);
}

function locateUser(autoFly = false) {
    if (!navigator.geolocation) {
        setStatus('GPS NOT AVAILABLE');
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {
        liveCoords = [position.coords.longitude, position.coords.latitude];
        liveAccuracy = position.coords.accuracy;
        createLiveMarker(liveCoords[0], liveCoords[1]);

        if (autoFly) {
            cinematicJump(liveCoords, 'YOUR LIVE LOCATION', () => {
                setStatus('LIVE LOCATION LOCKED');
            });
        } else {
            setStatus('3D EARTH ONLINE');
        }
    }, error => {
        console.warn('Geolocation:', error);
        setStatus('3D EARTH ONLINE');
    }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 30000});
}

function cinematicJump(target, label, onArrive) {
    if (!map || !Array.isArray(target)) return;

    const myJump = ++jumpToken;
    const destination = [...target];
    const start = [...currentFocus];
    const distance = Math.abs(start[0] - destination[0]) + Math.abs(start[1] - destination[1]);

    map.stop();
    isJumping = true;
    closePhotoPanel();
    showJumpHud(label);
    setStatus('JUMPING THROUGH THE GLOBE…');

    const finish = () => {
        if (myJump !== jumpToken) return;
        currentFocus = [...destination];
        isJumping = false;
        hideJumpHud();
        if (typeof onArrive === 'function') onArrive();
    };

    // Short local move: one smooth 3D dive is enough.
    if (distance < 1.2) {
        map.once('moveend', finish);
        map.flyTo({
            center: destination,
            zoom: 15.2,
            pitch: 72,
            bearing: map.getBearing() + 28,
            duration: 2600,
            essential: true
        });
        return;
    }

    // Long move: pull up to near-globe height, then dive into the target.
    map.once('moveend', () => {
        if (myJump !== jumpToken) return;
        map.once('moveend', finish);
        map.flyTo({
            center: destination,
            zoom: 13.8,
            pitch: 74,
            bearing: 24,
            speed: 0.72,
            curve: 1.55,
            essential: true
        });
    });

    map.flyTo({
        center: start,
        zoom: 1.8,
        pitch: 38,
        bearing: map.getBearing() + 18,
        duration: 2400,
        essential: true
    });
}

function focusPhoto(feature) {
    const coords = feature.geometry.coordinates;
    const props = feature.properties || {};
    const lat = Number(coords[1]);
    const lng = Number(coords[0]);
    const images = photoGroupAt(lng, lat);

    cinematicJump(coords, props.filename || 'PHOTO LOCATION', () => {
        openPhotoPanel(images.length ? images : [{
            filename: props.filename,
            thumb_url: props.thumb_url,
            url: props.url,
            folder_name: props.folder_name
        }], lat, lng, props.filename || 'Pinned memory');
        setStatus('DESTINATION LOCKED');
    });
}

function setupPhotoLayers() {
    map.addSource('photo-points', {
        type: 'geojson',
        data: photoCollection(),
        cluster: true,
        clusterMaxZoom: 13,
        clusterRadius: 58,
        clusterMinPoints: 2
    });

    map.addLayer({
        id: 'photo-cluster-glow',
        type: 'circle',
        source: 'photo-points',
        filter: ['has', 'point_count'],
        paint: {
            'circle-color': '#8b5cf6',
            'circle-radius': ['step', ['get', 'point_count'], 25, 10, 30, 30, 36, 100, 44],
            'circle-opacity': 0.20,
            'circle-blur': 0.75
        }
    });

    map.addLayer({
        id: 'photo-clusters',
        type: 'circle',
        source: 'photo-points',
        filter: ['has', 'point_count'],
        paint: {
            'circle-color': '#7c3aed',
            'circle-radius': ['step', ['get', 'point_count'], 18, 10, 22, 30, 27, 100, 32],
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2,
            'circle-opacity': 0.95
        }
    });

    map.addLayer({
        id: 'photo-cluster-count',
        type: 'symbol',
        source: 'photo-points',
        filter: ['has', 'point_count'],
        layout: {
            'text-field': ['get', 'point_count_abbreviated'],
            'text-size': 11,
            'text-font': ['Open Sans Bold']
        },
        paint: {'text-color': '#ffffff'}
    });

    map.addLayer({
        id: 'photo-glow',
        type: 'circle',
        source: 'photo-points',
        filter: ['!', ['has', 'point_count']],
        paint: {
            'circle-color': '#22d3ee',
            'circle-radius': 18,
            'circle-opacity': 0.18,
            'circle-blur': 0.75
        }
    });

    map.addLayer({
        id: 'photo-points',
        type: 'circle',
        source: 'photo-points',
        filter: ['!', ['has', 'point_count']],
        paint: {
            'circle-color': '#06b6d4',
            'circle-radius': 8,
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2.5
        }
    });

    map.on('click', 'photo-clusters', e => {
        const cluster = e.features?.[0];
        if (!cluster) return;
        map.getSource('photo-points').getClusterExpansionZoom(cluster.properties.cluster_id, (err, zoom) => {
            if (err) return;
            map.easeTo({
                center: cluster.geometry.coordinates,
                zoom: Math.min(zoom + 0.5, 14),
                pitch: 68,
                bearing: map.getBearing() + 20,
                duration: 1500,
                essential: true
            });
        });
    });

    map.on('click', 'photo-points', e => {
        const feature = e.features?.[0];
        if (feature) focusPhoto(feature);
    });

    ['photo-clusters', 'photo-points'].forEach(layer => {
        map.on('mouseenter', layer, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', layer, () => map.getCanvas().style.cursor = '');
    });
}

function initializeMap() {
    const count = usablePhotos().length;
    document.getElementById('asset-count').textContent = count;

    map = new maplibregl.Map({
        container: 'nexus-map',
        style: OPENFREE_MAP_STYLE,
        center: INDIA_CENTER,
        zoom: 4.2,
        pitch: 45,
        bearing: 0,
        projection: 'globe',
        renderWorldCopies: false,
        maxPitch: 85,
        attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'bottom-right');
    map.addControl(new maplibregl.ScaleControl({maxWidth: 120, unit: 'metric'}), 'bottom-left');

    map.on('load', () => {
        hideError();

        // Free global elevation source used by MapLibre's official examples.
        try {
            map.addSource('nexus-terrain', {
                type: 'raster-dem',
                url: TERRAIN_URL,
                tileSize: 256
            });
            map.setTerrain({source: 'nexus-terrain', exaggeration: 1.15});
        } catch (e) {
            console.warn('Terrain unavailable:', e);
        }

        setupPhotoLayers();
        setStatus(count ? `${count} GPS MEMORIES READY` : 'NO GPS MEMORIES YET');
        setTimeout(() => map.resize(), 100);
        locateUser(false);
    });

    map.on('error', event => {
        console.error('MapLibre error:', event?.error || event);
        // Do not hide the whole map for a single optional tile failure.
        if (!map?.isStyleLoaded()) {
            showError('The map style could not be loaded. Check your internet connection and refresh.');
            setStatus('MAP LOAD ERROR');
        }
    });
}

function jumpToLiveLocation() {
    if (liveCoords) {
        cinematicJump(liveCoords, 'YOUR LIVE LOCATION', () => setStatus('LIVE LOCATION LOCKED'));
    } else {
        locateUser(true);
    }
}

function returnToIndia() {
    cinematicJump(INDIA_CENTER, 'INDIA', () => setStatus('INDIA VIEW READY'));
}

function resetGlobe() {
    jumpToken++;
    isJumping = false;
    hideJumpHud();
    closePhotoPanel();
    currentFocus = [...INDIA_CENTER];
    map.stop();
    map.flyTo({center: INDIA_CENTER, zoom: 1.35, pitch: 22, bearing: 0, duration: 2200, essential: true});
    setStatus('GLOBAL VIEW');
}

// This file uses an ES module, so inline HTML onclick handlers cannot see
// module-scoped functions unless we explicitly expose them on window.
window.jumpToLiveLocation = jumpToLiveLocation;
window.returnToIndia = returnToIndia;
window.resetGlobe = resetGlobe;
window.closePhotoPanel = closePhotoPanel;
window.openExternalMaps = openExternalMaps;

document.addEventListener('DOMContentLoaded', initializeMap);
</script>
